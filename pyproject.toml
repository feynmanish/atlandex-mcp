[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "atlandex-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents search Atlandex's indexed video transcripts and cite the exact moment something is said."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atlandex-mcp = "atlandex_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlandex_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
